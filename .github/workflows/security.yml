name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Whole-tree dependency audits (js-deps/python-deps below) run on a weekly
  # cadence so newly-published advisories against already-shipped deps surface
  # on `main` without gating unrelated feature PRs. See the per-job `if:` guards.
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── PR dependency gate (diff-scoped) ───────────────────────────────────────
  # Runs only on PRs. Unlike the whole-tree audits below, this compares the
  # PR's base against its head and fails only on vulnerabilities the PR itself
  # *introduces* (npm + pip). That's the fair thing to block a feature PR on —
  # a brand-new upstream advisory against a dep the PR never touched should not
  # turn an unrelated PR red (that's what the scheduled whole-tree audit is for).
  dependency-review:
    name: Dependency review (PR diff)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # ── Whole-tree dependency vulnerabilities (push to main + weekly) ──────────
  # Deliberately NOT run on pull_request: `pip-audit`/`npm audit` scan the
  # entire installed tree, so a newly-published advisory against a transitive
  # dep would fail PRs that changed nothing about dependencies. The PR-time
  # signal is `dependency-review` above; here we keep monitoring `main` and get
  # a weekly heads-up on the full tree via the `schedule` trigger.
  python-deps:
    name: Python deps (pip-audit)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      - run: pip-audit -r apps/backend/requirements.txt --strict

  js-deps:
    name: JS deps (npm audit)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Same high/critical-only threshold as before (see audit-ci.jsonc),
      # plus a dated, reasoned allowlist for advisories confirmed
      # unexploitable in this app but with no upstream fix yet (both are
      # inside next@16.2.9's own vendored/optional deps). Fails on any
      # advisory not explicitly allowlisted, same as plain `npm audit` did.
      - run: npx audit-ci --config ./audit-ci.jsonc

  # ── Static analysis (SAST) ─────────────────────────────────────────────────
  bandit:
    name: Python SAST (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install bandit
      # -ll = report medium+ severity only (skips low-severity noise like asserts in tests).
      - run: bandit -r apps/backend/app -ll

  # ── Secret scanning ────────────────────────────────────────────────────────
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
