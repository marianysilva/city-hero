name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Dependency vulnerabilities ─────────────────────────────────────────────
  python-deps:
    name: Python deps (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      - run: pip-audit -r apps/backend/requirements.txt --strict

  js-deps:
    name: JS deps (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Same high/critical-only threshold as before (see audit-ci.jsonc),
      # plus a dated, reasoned allowlist for advisories confirmed
      # unexploitable in this app but with no upstream fix yet (both are
      # inside next@16.2.9's own vendored/optional deps). Fails on any
      # advisory not explicitly allowlisted, same as plain `npm audit` did.
      - run: npx audit-ci --config ./audit-ci.jsonc

  # ── Static analysis (SAST) ─────────────────────────────────────────────────
  bandit:
    name: Python SAST (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install bandit
      # -ll = report medium+ severity only (skips low-severity noise like asserts in tests).
      - run: bandit -r apps/backend/app -ll

  # ── Secret scanning ────────────────────────────────────────────────────────
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
