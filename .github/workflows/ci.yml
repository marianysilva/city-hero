name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    name: Backend Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: cityhero
          POSTGRES_PASSWORD: ci-test-password-only
          POSTGRES_DB: cityhero
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cityhero"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://cityhero:ci-test-password-only@localhost:5432/cityhero
      TEST_DATABASE_URL: postgresql+asyncpg://cityhero:ci-test-password-only@localhost:5432/cityhero_test
      SECRET_KEY: ci-test-secret-key-minimum-32-characters-long
      PGPASSWORD: ci-test-password-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Create test database
        run: |
          psql -h localhost -U cityhero -d cityhero -c "CREATE DATABASE cityhero_test;"
          psql -h localhost -U cityhero -d cityhero_test -c "CREATE EXTENSION IF NOT EXISTS postgis;"
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  web-lint:
    name: Web Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit --project apps/web/tsconfig.json
      - run: npm run lint --workspace=apps/web

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cityhero-backend ./apps/backend
      - run: docker build -t cityhero-web -f apps/web/Dockerfile .
