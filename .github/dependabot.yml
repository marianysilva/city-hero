version: 2
updates:
  # Backend Python dependencies
  - package-ecosystem: pip
    directory: /apps/backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend

  # JS/TS monorepo (root package-lock covers all workspaces: web, mobile, packages)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend

  # GitHub Actions workflow versions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci

  # Backend container base image
  - package-ecosystem: docker
    directory: /apps/backend
    schedule:
      interval: weekly
    labels:
      - dependencies
      - docker
