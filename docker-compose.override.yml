# Dev-only overrides — docker-compose auto-merges this on top of
# docker-compose.yml for every `docker-compose` invocation (make + scripts/dev.sh).
#
# Purpose: give the backend live-reload during development. The source tree is
# bind-mounted into the container and uvicorn runs with --reload, so editing a
# .py under apps/backend/ restarts the API in place — no image rebuild needed.
# Mounting the source into `migrate` likewise lets new Alembic revisions run
# without a rebuild.
#
# WATCHFILES_FORCE_POLLING makes uvicorn's file watcher reliable over bind
# mounts on WSL2 / Podman / networked filesystems (e.g. OneDrive), where native
# inotify events don't cross the host↔VM boundary. It costs a little CPU.
services:
  migrate:
    volumes:
      - ./apps/backend:/app

  backend:
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./apps/backend:/app
    environment:
      WATCHFILES_FORCE_POLLING: "true"
